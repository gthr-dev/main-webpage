name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you redeploy the current main without an empty commit.
  workflow_dispatch:

# Least privilege: the job needs to read the repo, publish a Pages artifact
# and mint an OIDC token for the deployment. Nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. cancel-in-progress stays false on purpose - cancelling
# a half-finished deploy is how a site ends up serving a partial build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # ci, not install: builds from the committed lockfile and fails if
      # package.json and the lockfile have drifted apart.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # PARKED: serving the holding page, not the app.
          # To go live, change this one line back to `path: ./dist`.
          # The build step above still runs, so the app stays verified
          # while parked and the switch back cannot surprise you.
          path: ./holding

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
